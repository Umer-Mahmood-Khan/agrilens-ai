# Render Blueprint: public demo where visitors use their own API keys.
# Render sets PORT and RENDER_EXTERNAL_HOSTNAME automatically.
# Do not add OPENAI_API_KEY or GEMINI_API_KEY here: in visitor mode the server
# never uses its own keys. Set LIVE_ANALYSIS to "off" for a sample-only demo.
services:
  - type: web
    name: agrilens-ai
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: LIVE_ANALYSIS
        value: visitor
      - key: AI_PROVIDER
        value: openai
      - key: LIVE_LIMIT_PER_HOUR
        value: "10"
      - key: TRUST_PROXY
        value: "1"
